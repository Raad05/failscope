[package]
name = "fail_client"
description = "Builds and sends fail_target's failing transactions (LiteSVM tests + devnet sender)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "send_failures"
path = "src/bin/send_failures.rs"

[dependencies]
anchor-lang = "1.2.0"
fail_callee = { path = "../programs/fail_callee", features = ["no-entrypoint"] }
fail_target = { path = "../programs/fail_target", features = ["no-entrypoint"] }
solana-compute-budget-interface = "3.0.0"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"

# devnet sender only
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-commitment-config = "3.0.0"
solana-rpc-client = "3.1.14"
solana-rpc-client-api = "3.1.14"
solana-signature = "3.0.0"
solana-transaction-error = "3.0.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-instruction-error = "2.0.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
