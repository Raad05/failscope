[package]
name = "failscope-api"
description = "HTTP API and dashboard for failscope."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "failscope"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
failscope-alert.workspace = true
clap.workspace = true
dotenvy.workspace = true
failscope-idl.workspace = true
failscope-ingest.workspace = true
failscope-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tower-http.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
failscope-decoder.workspace = true
sqlx.workspace = true
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
