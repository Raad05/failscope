[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4", features = ["derive", "env"] }
bs58 = "0.5"
dotenvy = "0.15"
failscope-decoder = { path = "crates/decoder" }
failscope-idl = { path = "crates/idl" }
failscope-ingest = { path = "crates/ingest" }
failscope-store = { path = "crates/store" }
flate2 = "1"
futures = "0.3"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-address = { version = "2.9", features = ["curve25519", "sha2", "decode"] }
solana-instruction-error = { version = "2.5", features = ["serde"] }
solana-transaction-error = { version = "3.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json"] }
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
yellowstone-grpc-client = "=12.1.0"
yellowstone-grpc-proto = "=12.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
