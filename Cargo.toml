[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bs58 = "0.5"
dotenvy = "0.15"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-instruction-error = { version = "2.5", features = ["serde"] }
solana-transaction-error = { version = "3.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
