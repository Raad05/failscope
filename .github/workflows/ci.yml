name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  offchain:
    name: off-chain (crates/)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: failscope
          POSTGRES_PASSWORD: failscope
          POSTGRES_DB: failscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U failscope"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://failscope:failscope@localhost:5432/failscope
      FAILSCOPE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain + components.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  onchain:
    name: on-chain (onchain/)
    runs-on: ubuntu-latest
    env:
      AGAVE_VERSION: 3.1.14
    defaults:
      run:
        working-directory: onchain
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - name: Cache Agave CLI and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}
      - name: Install Agave CLI
        run: |
          if [ ! -x ~/.local/share/solana/install/active_release/bin/cargo-build-sbf ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # LiteSVM tests load target/deploy/*.so. build-sbf defaults to SBPF v0 (D8).
      - run: cargo build-sbf --manifest-path programs/fail_callee/Cargo.toml
      - run: cargo build-sbf --manifest-path programs/fail_target/Cargo.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
