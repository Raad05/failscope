services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: failscope
      POSTGRES_PASSWORD: failscope
      POSTGRES_DB: failscope
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failscope"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
